<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moeda Estudantil — Portal</title>
  <meta name="description" content="Sistema de Moeda Estudantil: professores reconhecem o mérito dos alunos com moedas trocáveis por vantagens em empresas parceiras.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <div class="bg-glow"></div>
  <div id="toast-container"></div>

  <!-- ================= TELA DE ACESSO ================= -->
  <main id="tela-acesso" class="acesso">
    <section class="acesso-hero">
      <img src="img/dolar.png" alt="Logo Moeda Estudantil" class="logo">
      <h1>Moeda Estudantil</h1>
      <p>Reconheça o mérito. Troque por vantagens reais.</p>
    </section>

    <section class="card acesso-card">
      <div class="tabs">
        <button class="tab active" data-tab="login" id="tab-login">Entrar</button>
        <button class="tab" data-tab="cad-aluno" id="tab-cad-aluno">Sou aluno</button>
        <button class="tab" data-tab="cad-empresa" id="tab-cad-empresa">Sou empresa</button>
      </div>

      <form id="form-login" class="tab-panel active" data-panel="login">
        <label>E-mail<input id="login-email" type="email" required autocomplete="username"></label>
        <label>Senha<input id="login-senha" type="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary btn-block" id="btn-login" type="submit">Entrar</button>
      </form>

      <form id="form-cad-aluno" class="tab-panel" data-panel="cad-aluno">
        <div class="grid-2">
          <label>Nome<input id="ca-nome" required></label>
          <label>E-mail<input id="ca-email" type="email" required></label>
          <label>CPF<input id="ca-cpf" required placeholder="000.000.000-00"></label>
          <label>RG<input id="ca-rg" required></label>
        </div>
        <label>Endereço<input id="ca-endereco" required></label>
        <div class="grid-2">
          <label>Instituição<select id="ca-instituicao" required></select></label>
          <label>Curso<input id="ca-curso" required></label>
        </div>
        <label>Senha<input id="ca-senha" type="password" required minlength="4"></label>
        <button class="btn btn-primary btn-block" id="btn-cad-aluno" type="submit">Criar minha conta</button>
      </form>

      <form id="form-cad-empresa" class="tab-panel" data-panel="cad-empresa">
        <label>Nome da empresa<input id="ce-nome" required></label>
        <div class="grid-2">
          <label>E-mail<input id="ce-email" type="email" required></label>
          <label>CNPJ<input id="ce-cnpj" placeholder="opcional"></label>
        </div>
        <label>Senha<input id="ce-senha" type="password" required minlength="4"></label>
        <button class="btn btn-primary btn-block" id="btn-cad-empresa" type="submit">Cadastrar empresa</button>
      </form>
    </section>
  </main>

  <!-- ================= APLICAÇÃO ================= -->
  <div id="tela-app" class="app hidden">
    <header class="topbar">
      <div class="brand"><img src="img/dolar.png" alt="Logo" class="logo-sm"> Moeda Estudantil</div>
      <nav id="menu" class="menu"></nav>
      <div class="user">
        <span id="user-nome"></span>
        <span id="user-perfil" class="pill"></span>
        <button class="btn btn-ghost" id="btn-logout">Sair</button>
      </div>
    </header>
    <main id="conteudo" class="conteudo"></main>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="modal-overlay">
    <div class="modal card">
      <div class="modal-head"><h3 id="modal-titulo"></h3><button class="btn btn-ghost" id="modal-fechar">✕</button></div>
      <div id="modal-corpo"></div>
    </div>
  </div>

  <script src="js/portal.js"></script>
</body>
</html>
